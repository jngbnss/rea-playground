<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOSEON OUTLAW UI 목업</title>
<!-- 목업 미리보기용 웹폰트. 게임 빌드에는 OFL 원본 TTF를 넣는다 (docs/06-ui-design.md). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap" rel="stylesheet">
<style>
  :root {
    /* data/palette.json 과 같은 값이어야 한다 (tests/test_ui_mockup.py) */
    --ink: #1E1A17;
    --ink_soft: #3A332D;
    --hanji: #F1E7D3;
    --hanji_shade: #CDBE9F;
    --dancheong_red: #A5402F;
    --hp_red: #C4553F;
    --cheong_blue: #2F5868;
    --hwangto: #C49A4A;
    --pine: #3E5838;
    --sunset: #E6A25A;
    --fog: #8FA1A8;

    --f-title: "Song Myung", serif;
    --f-body: "Gowun Batang", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); height: 100%; }
  body { display: grid; place-items: center; overflow: hidden; }

  /* 1920×1080 기준 화면을 창 크기에 맞춰 축소 */
  .screen {
    position: relative; width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: center; font-family: var(--f-body); color: var(--hanji); word-break: keep-all;
  }

  /* ---------- 배경: 게임 화면 자리 표시 (해 질 녘 고갯길) ---------- */
  .scene { position: absolute; inset: 0; }
  .scene svg { width: 100%; height: 100%; display: block; }

  /* ---------- HUD: 체력 ---------- */
  .hud-hp { position: absolute; top: 56px; left: 64px; display: flex; align-items: center; gap: 20px; }
  .emblem {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--ink); border: 2px solid var(--hwangto);
    box-shadow: 0 0 0 6px rgba(30, 26, 23, .55);
    display: grid; place-items: center;
    font-family: var(--f-title); font-size: 38px; color: var(--hanji);
  }
  .hp-wrap { display: flex; flex-direction: column; gap: 8px; }
  .hp-name { font-family: var(--f-title); font-size: 26px; letter-spacing: .12em; color: var(--hanji); text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .hp-bar {
    width: 380px; height: 16px; background: rgba(30, 26, 23, .78);
    border: 1px solid var(--ink_soft); position: relative;
    clip-path: polygon(0 10%, 98% 0, 100% 55%, 99% 100%, 1% 92%);
  }
  .hp-fill {
    position: absolute; inset: 2px auto 2px 2px; width: 72%;
    background: linear-gradient(90deg, var(--hp_red), #D0664C 85%, var(--hp_red));
    clip-path: polygon(0 0, 97% 8%, 100% 40%, 96% 100%, 0 100%);
  }

  /* ---------- 퀘스트 두루마리 ---------- */
  .quest {
    position: absolute; top: 56px; right: 64px; width: 420px;
    background: var(--hanji); color: var(--ink);
    padding: 22px 28px 24px 84px; position: absolute;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
    border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink);
  }
  .quest::before, .quest::after { /* 두루마리 축 */
    content: ""; position: absolute; left: -10px; right: -10px; height: 10px;
    background: var(--ink_soft); border-radius: 5px;
  }
  .quest::before { top: -12px; }
  .quest::after { bottom: -12px; }
  .seal {
    position: absolute; left: 24px; top: 24px; width: 42px; padding: 10px 0 8px;
    background: var(--dancheong_red); color: var(--hanji);
    font-family: var(--f-title); font-size: 22px; line-height: 1; text-align: center;
    writing-mode: vertical-rl; letter-spacing: .3em;
  }
  .quest h2 { font-family: var(--f-title); font-weight: 400; font-size: 32px; letter-spacing: .06em; }
  .quest p { margin-top: 10px; font-size: 20px; line-height: 1.5; }
  .quest .dist { margin-top: 12px; font-size: 16px; color: var(--dancheong_red); letter-spacing: .04em; }

  /* ---------- 상호작용 안내 ---------- */
  .prompt {
    position: absolute; left: 1060px; top: 560px;
    display: flex; align-items: center; gap: 14px;
    font-size: 22px; text-shadow: 0 2px 8px rgba(0,0,0,.8);
  }
  .key {
    width: 40px; height: 40px; display: grid; place-items: center;
    border: 2px solid var(--hanji); border-radius: 6px; background: rgba(30,26,23,.7);
    font-family: var(--f-body); font-weight: 700; font-size: 20px;
  }

  /* ---------- 대화창 ---------- */
  .dialogue {
    position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
    width: 1400px; min-height: 230px;
    display: grid; grid-template-columns: 1fr 380px;
    background: linear-gradient(180deg, rgba(30,26,23,.94), rgba(30,26,23,.97));
    border-top: 1px solid var(--hwangto); border-bottom: 1px solid var(--ink_soft);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  /* 모서리 꺾쇠 장식 (창살 문양 단순화) */
  .dialogue .corner { position: absolute; width: 22px; height: 22px; border-color: var(--hwangto); border-style: solid; }
  .corner.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

  .nametag {
    position: absolute; top: -26px; left: 56px;
    background: var(--ink); border: 1px solid var(--hwangto);
    padding: 6px 26px 8px; font-family: var(--f-title); font-size: 30px; color: var(--hwangto); letter-spacing: .14em;
  }
  .line { padding: 52px 56px 40px 60px; font-size: 30px; line-height: 1.65; color: var(--hanji); word-break: keep-all; }
  .line .caret { display: inline-block; width: 12px; height: 12px; margin-left: 10px; background: var(--hwangto); transform: rotate(45deg) translateY(-4px); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .choices { list-style: none; padding: 40px 40px 36px 34px; border-left: 1px solid var(--ink_soft); display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .choices li { position: relative; padding: 10px 14px 10px 34px; font-size: 24px; color: var(--hanji_shade); }
  .choices li.on { color: var(--hwangto); background: linear-gradient(90deg, rgba(196,154,74,.14), transparent); }
  .choices li.on::before { content: ""; position: absolute; left: 10px; top: 50%; width: 10px; height: 10px; background: var(--hwangto); transform: translateY(-50%) rotate(45deg); }

</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="scene" aria-hidden="true">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2F5868"/>
          <stop offset=".45" stop-color="#8FA1A8"/>
          <stop offset=".72" stop-color="#E6A25A"/>
          <stop offset="1" stop-color="#F1E7D3"/>
        </linearGradient>
        <radialGradient id="sun" cx="1380" cy="610" r="420" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#F1E7D3" stop-opacity=".95"/>
          <stop offset=".25" stop-color="#E6A25A" stop-opacity=".55"/>
          <stop offset="1" stop-color="#E6A25A" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F1E7D3" stop-opacity="0"/>
          <stop offset="1" stop-color="#F1E7D3" stop-opacity=".55"/>
        </linearGradient>
      </defs>
      <rect width="1920" height="1080" fill="url(#sky)"/>
      <circle cx="1380" cy="610" r="420" fill="url(#sun)"/>
      <!-- 원경 능선: 멀수록 안개색 -->
      <path d="M0 640 C160 560 300 600 420 540 S700 470 860 560 1120 520 1260 590 1560 500 1720 560 1920 520 1920 520 V1080 H0Z" fill="#8FA1A8" opacity=".75"/>
      <rect y="560" width="1920" height="160" fill="url(#mist)"/>
      <path d="M0 720 C200 640 360 690 520 630 S820 600 980 680 1240 640 1400 700 1700 620 1920 680 V1080 H0Z" fill="#2F5868" opacity=".85"/>
      <rect y="660" width="1920" height="140" fill="url(#mist)" opacity=".7"/>
      <path d="M0 820 C240 760 420 800 640 770 S1000 820 1240 790 1640 760 1920 800 V1080 H0Z" fill="#3E5838"/>
      <!-- 근경: 소나무와 장승 실루엣 -->
      <g fill="#1E1A17">
        <path d="M0 880 C300 850 600 900 900 870 S1500 880 1920 860 V1080 H0Z"/>
        <!-- 기와 처마: 끝이 살짝 들리는 곡선이 한옥 인상의 핵심 -->
        <path d="M0 560 L360 560 C420 600 470 640 520 652 C548 658 566 650 580 636 C574 662 548 680 512 684 C440 690 300 694 0 700Z"/>
        <g stroke="#3A332D" stroke-width="3" opacity=".9">
          <path d="M40 568 V694 M90 568 V695 M140 568 V695 M190 568 V696 M240 568 V696 M290 568 V696 M340 568 V694 M390 586 V692 M440 620 V690"/>
        </g>
        <path d="M0 700 H500 V716 H0Z" fill="#3A332D"/>
        <rect x="70" y="716" width="22" height="190"/>
        <rect x="360" y="716" width="22" height="190"/>
        <rect x="92" y="740" width="268" height="140" fill="#E6A25A" opacity=".35"/>
        <g stroke="#1E1A17" stroke-width="5"><path d="M92 740 H360 M92 810 H360 M181 740 V880 M270 740 V880"/></g>
        <rect x="1500" y="740" width="26" height="150" rx="6"/>
        <ellipse cx="1513" cy="735" rx="22" ry="26"/>
        <rect x="1560" y="760" width="22" height="130" rx="6"/>
        <ellipse cx="1571" cy="755" rx="19" ry="22"/>
      </g>
    </svg>
  </div>

  <div class="hud-hp">
    <div class="emblem f-title">검</div>
    <div class="hp-wrap">
      <div class="hp-name f-title">떠돌이 검객</div>
      <div class="hp-bar" role="meter" aria-label="체력" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100"><div class="hp-fill"></div></div>
    </div>
  </div>

  <aside class="quest">
    <div class="seal f-title">의뢰</div>
    <h2 class="f-title">빼앗긴 장부</h2>
    <p>북쪽 고갯길의 도적 소굴에서 장부를 되찾는다</p>
    <div class="dist">서낭당까지 약 120보</div>
  </aside>

  <div class="prompt"><span class="key">E</span>장승 살펴보기</div>

  <section class="dialogue" aria-label="대화">
    <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
    <div class="nametag f-title">윤 행수</div>
    <p class="line">어허, 칼 찬 나그네로구려. 북쪽 고갯길 도적에게 내 장부를 빼앗겼소. 찾아 주면 쉰 냥을 드리리다.<span class="caret"></span></p>
    <ul class="choices">
      <li class="on">장부를 찾아오겠소.</li>
      <li>도적은 어디에 있소?</li>
      <li>(자리를 뜬다)</li>
    </ul>
  </section>
</div>
<script>
  // 창 크기에 맞춰 1920×1080 화면을 축소
  function fit() {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    document.getElementById("screen").style.transform = `scale(${s})`;
  }
  addEventListener("resize", fit); fit();
</script>
</body>
</html>

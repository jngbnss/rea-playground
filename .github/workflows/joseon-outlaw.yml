name: JOSEON OUTLAW CI and Pages

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/joseon-outlaw.yml"
      - "projects/joseon-outlaw/**"
  pull_request:
    paths:
      - ".github/workflows/joseon-outlaw.yml"
      - "projects/joseon-outlaw/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke:
    name: Python, Godot and Windows build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/joseon-outlaw
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install API dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python checks
        run: python run_smoke.py
      - name: Install Godot 4.7.2 and export templates
        run: |
          curl -L -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl -L -o /tmp/templates.tpz https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/export-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp -R /tmp/export-templates/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import Godot project
        run: '"$GODOT_BIN" --headless --editor --path game --quit'
      - name: Run Godot and API integration
        run: |
          python -m tools.godot_smoke --phase 7
          python -m tools.ai_integration_smoke
          python -m tools.repeat_godot_smoke --phase 7 --runs 10
      - name: Export Windows release
        run: python -m tools.export_windows --phase 7 --output /tmp/JOSEON_OUTLAW.exe --export-only
      - name: Upload Windows release
        uses: actions/upload-artifact@v6
        with:
          name: JOSEON_OUTLAW-windows
          path: /tmp/JOSEON_OUTLAW.exe
          if-no-files-found: error

  deploy:
    name: Deploy UI mockup
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: smoke
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          lfs: true
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload UI mockup
        uses: actions/upload-pages-artifact@v5
        with:
          path: projects/joseon-outlaw/ui-mockup
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
